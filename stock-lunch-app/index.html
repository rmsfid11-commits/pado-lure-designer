<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>주식쟁이 점심룰렛</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>주식쟁이 점심룰렛</h1>
    <p class="subtitle">오늘 계좌 수익률로 점심 메뉴 뽑기</p>

    <section class="input-card">
      <div class="stepper">
        <p id="rateDisplay" class="rate-display" aria-live="polite">
          <span id="rateValue">0</span><span class="unit">%</span>
        </p>
        <div class="spin-buttons">
          <button id="incBtn" type="button" class="spin-btn" aria-label="수익률 올리기">▲</button>
          <button id="decBtn" type="button" class="spin-btn" aria-label="수익률 내리기">▼</button>
        </div>
      </div>
      <p class="stepper-hint">숫자를 위아래로 끌어도 돼요</p>
      <button id="drawBtn" class="btn-primary">오늘 점심 뽑기</button>
    </section>
  </main>

  <div id="resultOverlay" class="overlay hidden">
    <div id="resultCard" class="reveal-card">
      <div id="confettiLayer" class="confetti-layer"></div>
      <p class="reveal-emoji" id="resultEmoji"></p>
      <p class="reveal-rate" id="resultRate"></p>
      <h2 class="reveal-menu" id="resultMenu"></h2>
      <p class="reveal-comment" id="resultComment"></p>
      <div class="reveal-actions">
        <button id="reDrawBtn" class="btn-primary">다시 뽑기</button>
        <button id="closeBtn" class="btn-text">닫기</button>
      </div>
    </div>
  </div>

  <script src="menuData.js"></script>
  <script src="app.js"></script>
</body>
</html>
